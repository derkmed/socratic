[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socratic"
version = "0.1.0"
description = "Socratic learning app — quiz domain package"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The Anthropic SDK is an optional extra, never a base dependency: the domain
# must be testable with no SDK installed (ADR-0002 portability seam, spec §5 —
# the adapter is the only module that may import it).
anthropic = ["anthropic>=1.4"]
# Content rendering is an extra for the same reason and by the same rule:
# `test_import_hygiene.py::test_the_package_has_no_base_dependencies` asserts
# `dependencies == []`, so the domain installs and tests with no third-party
# package at all. `socratic.rendering` is the only importer — ADR-0012,
# master spec §7, `docs/specs/content-rendering.md`.
rendering = [
    "nh3>=0.2.18",           # sanitiser; `bleach` is deprecated in its favour
    "markdown-it-py>=3,<5",  # the restricted Markdown subset
    "Pygments>=2.17",        # fenced-code highlighting, inlined not linked
    "latex2mathml>=3.77",    # LaTeX to MathML, server-side
]
# The HTTP service is an extra by the same rule as the two above: the domain
# installs and tests with no third-party package at all, and nothing under
# `socratic.domain` may import any of these. `socratic.service` is the only
# importer — ADR-0015, master spec §10, `docs/specs/quiz-service.md`.
service = [
    "fastapi>=0.115",   # routing, request models, dependency-ordered auth
    "uvicorn>=0.30",    # the ASGI server the container runs
    # `status` is Starlette's, re-exported through FastAPI, and FastAPI's own
    # pin is only `starlette>=0.46` — which predates
    # `HTTP_422_UNPROCESSABLE_CONTENT` (added in 0.48.0, deprecating
    # `HTTP_422_UNPROCESSABLE_ENTITY`). `app.py` reads the new name, so the
    # floor has to be stated here rather than left to FastAPI (#99).
    "starlette>=0.48",
]
dev = [
    "pytest>=8",
    "tomli>=2; python_version < '3.11'",
    "httpx>=0.27",      # FastAPI's TestClient transport; no socket is opened
]

[tool.hatch.build.targets.wheel]
packages = ["src/socratic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
