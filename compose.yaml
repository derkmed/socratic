# Two containers, composed: Open WebUI and the quiz service (D15, ADR-0015).
#
# The prototype targets a **default** Open WebUI install — `IFRAME_CSP` unset —
# because that is the only configuration in which the sandboxed, opaque-origin
# iframe can `fetch` the service at all. Under the hardening docs' recommended
# CSP the iframe has no network path here, which is a different architecture
# rather than a degraded one (master spec, Out of scope).
#
# No host networking and no bind mount of build output, so `docker compose up`
# behaves the same on Mac, Windows and Linux.

services:
  quiz-service:
    build: .
    environment:
      # Both secrets come from the host environment; neither has a default,
      # so a missing one fails at startup rather than silently weakening.
      SOCRATIC_TOKEN_SECRET: ${SOCRATIC_TOKEN_SECRET:?set a secret of >=32 bytes}
      SOCRATIC_SERVICE_TOKEN: ${SOCRATIC_SERVICE_TOKEN:?set the Pipe's service token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?authoring makes a live model call}
      # Where the *learner's browser* reaches this service, rendered into the
      # overlay so its `fetch` has an absolute URL to use (#13). A `srcdoc`
      # document inherits its parent's base URL, so a relative path would send
      # every answer to Open WebUI instead. Not the compose DNS name below:
      # that one is only reachable from inside the network.
      SOCRATIC_PUBLIC_URL: ${SOCRATIC_PUBLIC_URL:-http://localhost:8080}
      # The collected records trail (#117, ADR-0018). On by default: a
      # demonstration of data collection that collects nothing until a second
      # variable is set demonstrates the opposite. Write-only — the service
      # never reads this directory back, so a restart still loses every
      # in-flight quiz.
      SOCRATIC_DATA_DIR: ${SOCRATIC_DATA_DIR:-/data}
      # `on_close` writes an attempt once, when it is sealed or abandoned;
      # `every_save` writes on every guess and probe, so files appear while a
      # quiz is being taken. Held here rather than in the Pipe's valves beside
      # `mode`: an audit trail a caller can reshape per-request is not one.
      SOCRATIC_DATA_FLUSH: ${SOCRATIC_DATA_FLUSH:-on_close}
    ports:
      # Published to the host because the iframe fetches it from the learner's
      # browser, not from inside the compose network.
      - "8080:8080"
    volumes:
      # A bind mount rather than a named volume: reading a named volume needs
      # `docker cp`, and a demonstration of collected data you cannot see is
      # not one. The standing objection to bind mounts above is about *build
      # output* differing across Mac, Windows and Linux — a data directory does
      # not have that problem. Gitignored; it holds answer keys.
      - ./data:/data

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - quiz-service
    environment:
      # The Pipe reaches the service by its compose DNS name, from inside this
      # network. The learner's browser reaches it by a different name — and that
      # one is not set here and cannot be: it is the service's own
      # `SOCRATIC_PUBLIC_URL` above, held by the container that renders the
      # overlay because that is where it is rendered, never accepted from a
      # caller (#13, D15). Publishing on another host port means changing that
      # variable and the port mapping above; nothing on this container.
      SOCRATIC_SERVICE_URL: http://quiz-service:8080
      SOCRATIC_SERVICE_TOKEN: ${SOCRATIC_SERVICE_TOKEN:?set the Pipe's service token}
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
